site_name: pynxtools-xrm — ZBT
site_description: Streaming ZEISS XRM conversion to NeXus and deployment in NOMAD Oasis.
site_author: Jonas Fortmann, ZBT – Zentrum für BrennstoffzellenTechnik GmbH
repo_url: https://github.com/jonasdfortmann/pynxtools-xrm
edit_uri: ""

nav:
  - Home: index.md
  - Tutorials:
      - Installation: tutorial/installation.md
      - Development: tutorial/contributing.md
  - How-to guides:
      - Deploy on NOMAD Oasis: howto/oasis-deployment.md
      - Structure an upload: howto/nomad-upload.md
      - Supply additional metadata: howto/additional-metadata.md
      - Troubleshoot conversion: howto/troubleshooting.md
      - Windows ZIP import: troubleshooting-windows-zip-upload.md
  - Explanation:
      - Architecture: architecture.md
      - Versions and reproducibility: learn/versioning.md
  - Reference:
      - Configuration and CLI: reference/configuration.md
      - Metadata mapping: metadata-mapping.md
      - Outputs: reference/outputs.md
      - Synthetic example: reference/example-upload.md
  - Contact and citation: contact.md

plugins:
  - search

theme:
  name: material
  palette:
    primary: '#2A4CDF'
    accent: '#008A67'
  font:
    text: 'Titillium Web'
  icon:
    logo: material/microscope
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.extra
  - pymdownx.superfences

extra:
  generator: false

use_directory_urls: false
extra_css:
  - stylesheets/extra.css
