name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      
      - name: Install uv and set the python version to ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install released NOMAD compatibility target
        run: |
          uv pip install "nomad-lab[infrastructure]>=1.4.1"
      - name: Install package and pinned pynxtools compatibility range
        run: |
          # Editable install is necessary for coveralls to work
          uv pip install -e ".[dev]"
          uv pip install coverage coveralls
      - name: Test with pytest
        run: |
          python -m pynxtools_xrm.definitions "$RUNNER_TEMP/xrm-definitions"
          export NEXUS_DEF_PATH="$RUNNER_TEMP/xrm-definitions"
          coverage run -m pytest -sv --show-capture=no tests
      - name: Submit to coveralls
        continue-on-error: true
        if: ${{ matrix.python-version == '3.12' }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            coveralls --service=github
